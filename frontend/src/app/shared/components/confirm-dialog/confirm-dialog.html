<div class="confirm-dialog">
  <div class="confirm-dialog__icon" [class.confirm-dialog__icon--danger]="data.danger">
    <mat-icon>{{ data.danger ? 'warning' : 'help_outline' }}</mat-icon>
  </div>
  <h2 mat-dialog-title>{{ data.title }}</h2>
  <mat-dialog-content>{{ data.message }}</mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">{{ data.cancelLabel || 'Cancel' }}</button>
    <button mat-flat-button [color]="data.danger ? 'warn' : 'primary'" (click)="confirm()">
      {{ data.confirmLabel || 'Confirm' }}
    </button>
  </mat-dialog-actions>
</div>
