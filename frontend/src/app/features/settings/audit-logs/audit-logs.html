<div class="audit-logs">
  <div class="audit-logs__header">
    <div>
      <h1>{{ 'breadcrumb.auditLogs' | translate }}</h1>
      <p class="text-muted">{{ 'settings.auditLogsSubtitle' | translate }}</p>
    </div>
    <mat-form-field appearance="outline" class="audit-logs__module-filter" subscriptSizing="dynamic">
      <mat-label>{{ 'settings.module' | translate }}</mat-label>
      <mat-select [ngModel]="moduleFilter()" (ngModelChange)="onModuleFilterChange($event)">
        <mat-option value="">{{ 'settings.allModules' | translate }}</mat-option>
        @for (m of modules; track m) {
          <mat-option [value]="m">{{ m }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  <coms-data-table
    tableId="audit-logs"
    exportFileName="audit-logs"
    emptyMessageKey="settings.noActivityYet"
    [columns]="columns"
    [rows]="rows()"
    [total]="total()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [loading]="loading()"
    [cellTemplates]="cellTemplates"
    [exportAllFn]="exportAllRows"
    (pageChange)="onPageChange($event)"
    (searchChange)="onSearchChange($event)"
  />
</div>

<ng-template #actionTpl let-row>
  <span class="status-chip" [style.background]="actionColor(row.action) + '22'" [style.color]="actionColor(row.action)">
    {{ row.action }}
  </span>
</ng-template>

<ng-template #detailTpl let-row>
  <button mat-icon-button [matTooltip]="'settings.viewDetail' | translate" (click)="viewDetail(row)">
    <mat-icon>visibility</mat-icon>
  </button>
</ng-template>
