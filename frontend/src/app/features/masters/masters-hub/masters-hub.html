<div class="masters-hub">
  <div class="masters-hub__header">
    <h1>{{ 'masters.hubTitle' | translate }}</h1>
    <p class="text-muted">{{ 'masters.hubSubtitle' | translate }}</p>
  </div>

  @for (group of groups; track group.label) {
    <div class="masters-hub__group">
      <div class="masters-hub__group-header">
        <mat-icon>{{ group.icon }}</mat-icon>
        <h2>{{ group.label | translate }}</h2>
      </div>
      <div class="masters-hub__grid">
        @for (item of group.items; track item.key) {
          <a class="masters-hub__card" [routerLink]="['/masters', item.key]">
            <mat-icon>{{ configs[item.key].icon }}</mat-icon>
            <span>{{ item.label | translate }}</span>
          </a>
        }
      </div>
    </div>
  }
</div>
