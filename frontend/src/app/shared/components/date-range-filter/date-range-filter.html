<div class="date-range-filter">
  <button mat-stroked-button [matMenuTriggerFor]="menu">
    <mat-icon>date_range</mat-icon>
    {{ label() }}
    <mat-icon>arrow_drop_down</mat-icon>
  </button>

  <mat-menu #menu="matMenu" class="date-range-filter__menu">
    <div class="date-range-filter__presets" (click)="$event.stopPropagation()">
      @for (p of presets; track p.key) {
        <button mat-menu-item (click)="applyPreset(p.key)">
          @if (activePreset() === p.key) {
            <mat-icon>check</mat-icon>
          }
          <span>{{ p.label }}</span>
        </button>
      }

      <div class="date-range-filter__custom" (click)="$event.stopPropagation()">
        <mat-form-field appearance="outline" class="date-range-filter__custom-field">
          <mat-label>From</mat-label>
          <input matInput [matDatepicker]="fromPicker" [(ngModel)]="customFrom" />
          <mat-datepicker-toggle matIconSuffix [for]="fromPicker" />
          <mat-datepicker #fromPicker />
        </mat-form-field>
        <mat-form-field appearance="outline" class="date-range-filter__custom-field">
          <mat-label>To</mat-label>
          <input matInput [matDatepicker]="toPicker" [(ngModel)]="customTo" />
          <mat-datepicker-toggle matIconSuffix [for]="toPicker" />
          <mat-datepicker #toPicker />
        </mat-form-field>
        <button mat-flat-button color="primary" [disabled]="!customFrom || !customTo" (click)="applyCustom()">
          Apply custom range
        </button>
      </div>
    </div>
  </mat-menu>
</div>
