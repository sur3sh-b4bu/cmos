<div class="settings-hub">
  <div class="settings-hub__header">
    <h1>{{ 'nav.settings' | translate }}</h1>
    <p class="text-muted">{{ 'settings.hubSubtitle' | translate }}</p>
  </div>

  <div class="settings-hub__grid">
    @for (card of visibleCards(); track card.route) {
      <a class="settings-hub__card glass-card glass-card--interactive" [routerLink]="card.route">
        <mat-icon>{{ card.icon }}</mat-icon>
        <div>
          <h2>{{ card.labelKey | translate }}</h2>
          <p>{{ card.descriptionKey | translate }}</p>
        </div>
      </a>
    }
  </div>
</div>
