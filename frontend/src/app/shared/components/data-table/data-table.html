<div class="data-table surface-card">
  <div class="data-table__toolbar">
    <mat-form-field appearance="outline" class="data-table__search">
      <mat-icon matPrefix>search</mat-icon>
      <input
        matInput
        placeholder="Quick search..."
        [ngModel]="searchTerm"
        (ngModelChange)="onSearchInput($event)"
      />
    </mat-form-field>

    <div class="data-table__toolbar-actions">
      @if (showExport) {
        <button mat-stroked-button (click)="exportExcel()" [disabled]="exporting()">
          <mat-icon>grid_on</mat-icon>
          Export Excel
        </button>
      }
      <button mat-icon-button [matMenuTriggerFor]="columnMenu" matTooltip="Choose columns">
        <mat-icon>view_column</mat-icon>
      </button>
      <mat-menu #columnMenu="matMenu">
        <div class="data-table__column-menu" (click)="$event.stopPropagation()">
          @for (col of columns; track col.key) {
            <mat-checkbox [checked]="isColumnVisible(col.key)" (change)="toggleColumn(col.key)">
              {{ col.label }}
            </mat-checkbox>
          }
        </div>
      </mat-menu>
    </div>
  </div>

  @if (loading) {
    <mat-progress-bar mode="indeterminate" />
  }

  <div class="data-table__scroll">
    <table mat-table [dataSource]="rows" matSort (matSortChange)="onSortEvent($event)">
      @for (col of visibleColumns(); track col.key) {
        <ng-container [matColumnDef]="col.key">
          <th mat-header-cell *matHeaderCellDef [mat-sort-header]="col.sortable ? col.key : ''" [disabled]="!col.sortable" [style.text-align]="col.align || 'left'">
            {{ col.label }}
          </th>
          <td mat-cell *matCellDef="let row" [style.text-align]="col.align || 'left'">
            @if (cellTemplates[col.key]) {
              <ng-container *ngTemplateOutlet="cellTemplates[col.key]; context: { $implicit: row }" />
            } @else {
              {{ getCellValue(row, col) }}
            }
          </td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns()"
        class="data-table__row"
        (click)="rowClick.emit(row)"
      ></tr>
    </table>

    @if (!loading && rows.length === 0) {
      <div class="data-table__empty">{{ emptyMessage }}</div>
    }
  </div>

  <mat-paginator
    [length]="total"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPageEvent($event)"
    showFirstLastButtons
  />
</div>
