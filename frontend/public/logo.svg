<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 240" role="img" aria-label="Church Office Management System">
  <!-- COMS brand seal: teal/navy/gold circular badge, hand-recreated from
       the project's reference logo (church + steeple + cross, flanked by
       gears, resting on an open book, with a family group), since no source
       file for the original artwork was available to embed directly. Used
       as the browser favicon (index.html), the sidebar brand crest when no
       per-church logo is uploaded (sidebar.html), and the login page crest
       (login.html). -->
  <!-- outer ring + white face -->
  <circle cx="120" cy="120" r="116" fill="#ffffff" stroke="#2f7a72" stroke-width="6" />
  <circle cx="120" cy="120" r="104" fill="none" stroke="#1c3b57" stroke-width="1.5" />

  <!-- gold seam dots, left/right -->
  <circle cx="20" cy="120" r="4.5" fill="#c9a13b" />
  <circle cx="220" cy="120" r="4.5" fill="#c9a13b" />

  <!-- curved wordmark: individual glyphs placed and rotated along the
       ring by hand (see the project scratchpad gen-arc.js), rather than
       SVG textPath, since resvg-family rasterizers used by common SVG-to-
       PNG/ICO conversion tooling silently drop textPath text entirely,
       while plain positioned text renders everywhere. -->
  <g>
    <text x="28.24" y="95.41" transform="rotate(-75.00 28.24 95.41)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="18" fill="#16324f">C</text>
    <text x="35.73" y="76.13" transform="rotate(-62.50 35.73 76.13)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="18" fill="#16324f">H</text>
    <text x="47.23" y="58.94" transform="rotate(-50.00 47.23 58.94)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="18" fill="#16324f">U</text>
    <text x="62.17" y="44.63" transform="rotate(-37.50 62.17 44.63)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="18" fill="#16324f">R</text>
    <text x="79.85" y="33.90" transform="rotate(-25.00 79.85 33.90)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="18" fill="#16324f">C</text>
    <text x="99.44" y="27.25" transform="rotate(-12.50 99.44 27.25)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="18" fill="#16324f">H</text>
    <text x="140.56" y="27.25" transform="rotate(12.50 140.56 27.25)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="18" fill="#16324f">O</text>
    <text x="160.15" y="33.90" transform="rotate(25.00 160.15 33.90)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="18" fill="#16324f">F</text>
    <text x="177.83" y="44.63" transform="rotate(37.50 177.83 44.63)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="18" fill="#16324f">F</text>
    <text x="192.77" y="58.94" transform="rotate(50.00 192.77 58.94)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="18" fill="#16324f">I</text>
    <text x="204.27" y="76.13" transform="rotate(62.50 204.27 76.13)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="18" fill="#16324f">C</text>
    <text x="211.76" y="95.41" transform="rotate(75.00 211.76 95.41)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="18" fill="#16324f">E</text>
  </g>
  <g>
    <text x="24.23" y="126.70" transform="rotate(86.00 24.23 126.70)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16.5" fill="#16324f">M</text>
    <text x="27.16" y="144.44" transform="rotate(75.25 27.16 144.44)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16.5" fill="#16324f">A</text>
    <text x="33.35" y="161.33" transform="rotate(64.50 33.35 161.33)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16.5" fill="#16324f">N</text>
    <text x="42.58" y="176.77" transform="rotate(53.75 42.58 176.77)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16.5" fill="#16324f">A</text>
    <text x="54.53" y="190.21" transform="rotate(43.00 54.53 190.21)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16.5" fill="#16324f">G</text>
    <text x="68.77" y="201.19" transform="rotate(32.25 68.77 201.19)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16.5" fill="#16324f">E</text>
    <text x="84.82" y="209.32" transform="rotate(21.50 84.82 209.32)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16.5" fill="#16324f">M</text>
    <text x="102.09" y="214.32" transform="rotate(10.75 102.09 214.32)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16.5" fill="#16324f">E</text>
    <text x="120.00" y="216.00" transform="rotate(0.00 120.00 216.00)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16.5" fill="#16324f">N</text>
    <text x="137.91" y="214.32" transform="rotate(-10.75 137.91 214.32)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16.5" fill="#16324f">T</text>
    <text x="171.23" y="201.19" transform="rotate(-32.25 171.23 201.19)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16.5" fill="#16324f">S</text>
    <text x="185.47" y="190.21" transform="rotate(-43.00 185.47 190.21)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16.5" fill="#16324f">Y</text>
    <text x="197.42" y="176.77" transform="rotate(-53.75 197.42 176.77)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16.5" fill="#16324f">S</text>
    <text x="206.65" y="161.33" transform="rotate(-64.50 206.65 161.33)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16.5" fill="#16324f">T</text>
    <text x="212.84" y="144.44" transform="rotate(-75.25 212.84 144.44)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16.5" fill="#16324f">E</text>
    <text x="215.77" y="126.70" transform="rotate(-86.00 215.77 126.70)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16.5" fill="#16324f">M</text>
  </g>

  <!-- center emblem -->
  <g>
    <!-- open book -->
    <path d="M120,150 L60,170 L69,199 L120,183 Z" fill="#3f6fb0" />
    <path d="M120,150 L180,170 L171,199 L120,183 Z" fill="#3f6fb0" />
    <path d="M60,170 L69,199 M76,168 L84,196 M92,163 L99,192" stroke="#c9a13b" stroke-width="1" opacity="0.6" />
    <path d="M180,170 L171,199 M164,168 L156,196 M148,163 L141,192" stroke="#c9a13b" stroke-width="1" opacity="0.6" />
    <rect x="117" y="150" width="6" height="33" fill="#16324f" />

    <!-- gears flanking the steeple -->
    <g fill="#3f6fb0">
      <g transform="translate(82,88)">
        <path d="M0,-17 L4,-17 L5,-11 L10,-9 L15,-13 L18,-10 L14,-5 L16,0 L22,1 L22,5 L16,6 L14,11 L18,14 L15,18 L10,15 L5,17 L4,23 L0,23 L-1,17 L-6,15 L-11,18 L-14,14 L-10,11 L-12,6 L-18,5 L-18,1 L-12,0 L-10,-5 L-14,-10 L-11,-13 L-6,-9 L-1,-11 Z" />
        <circle cx="0" cy="3" r="8" fill="#ffffff" />
      </g>
      <g transform="translate(158,88)">
        <path d="M0,-17 L4,-17 L5,-11 L10,-9 L15,-13 L18,-10 L14,-5 L16,0 L22,1 L22,5 L16,6 L14,11 L18,14 L15,18 L10,15 L5,17 L4,23 L0,23 L-1,17 L-6,15 L-11,18 L-14,14 L-10,11 L-12,6 L-18,5 L-18,1 L-12,0 L-10,-5 L-14,-10 L-11,-13 L-6,-9 L-1,-11 Z" />
        <circle cx="0" cy="3" r="8" fill="#ffffff" />
      </g>
    </g>

    <!-- family group, right of the book -->
    <g fill="#c9a13b">
      <circle cx="158" cy="141" r="5" />
      <path d="M150,161 L150,150 Q158,144 166,150 L166,161 Z" />
      <circle cx="177" cy="141" r="5" />
      <path d="M169,161 L169,150 Q177,144 185,150 L185,161 Z" />
      <circle cx="167.5" cy="149" r="6.5" />
      <path d="M155,172 L155,157 Q167.5,148 180,157 L180,172 Z" />
    </g>

    <!-- steeple + cross -->
    <polygon points="112,96 120,60 128,96" fill="#2f7a72" />
    <rect x="118" y="40" width="4" height="24" fill="#2f7a72" />
    <rect x="111" y="47" width="18" height="4" fill="#2f7a72" />

    <!-- church body -->
    <polygon points="90,140 150,140 120,116" fill="#245f5a" />
    <rect x="96" y="140" width="48" height="47" fill="#2f7a72" />
    <circle cx="120" cy="149" r="4.5" fill="#ffffff" />
    <path d="M112,187 L112,166 A8,8 0 0 1 128,166 L128,187 Z" fill="#ffffff" />
  </g>
</svg>
