<div class="mat-calendar-header coms-today-header">
  <div class="mat-calendar-controls">
    <button
      mat-button
      type="button"
      class="mat-calendar-period-button"
      (click)="currentPeriodClicked()"
      [attr.aria-label]="periodButtonLabel"
      aria-live="polite"
    >
      <span aria-hidden="true">{{ periodButtonText }}</span>
      <svg
        class="mat-calendar-arrow"
        [class.mat-calendar-invert]="calendar.currentView !== 'month'"
        viewBox="0 0 10 5"
        focusable="false"
        aria-hidden="true"
      >
        <polygon points="0,0 5,5 10,0" />
      </svg>
    </button>

    <div class="mat-calendar-spacer"></div>

    <button
      mat-icon-button
      type="button"
      class="mat-calendar-previous-button"
      [disabled]="!previousEnabled()"
      (click)="previousClicked()"
      [attr.aria-label]="prevButtonLabel"
    >
      <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
      </svg>
    </button>

    <button
      mat-icon-button
      type="button"
      class="mat-calendar-next-button"
      [disabled]="!nextEnabled()"
      (click)="nextClicked()"
      [attr.aria-label]="nextButtonLabel"
    >
      <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
      </svg>
    </button>
  </div>

  <button mat-stroked-button type="button" class="coms-today-header__btn" (click)="goToToday()">
    <mat-icon>today</mat-icon>
    <span>{{ 'common.today' | translate }}</span>
  </button>
</div>
